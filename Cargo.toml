[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/metadata-manager",
    "crates/policy-core",
    "crates/policy-simulator",
    "crates/workload-worker",
    "crates/workload-generator",
    "crates/fusion-pipeline",
    "crates/rustland-scheduler",
]
default-members = [
    "crates/common",
    "crates/metadata-manager",
    "crates/policy-core",
    "crates/policy-simulator",
    "crates/workload-worker",
    "crates/workload-generator",
    "crates/fusion-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-only"
authors = ["Amir project"]
repository = "local"

[workspace.dependencies]
anyhow = "=1.0.95"
clap = { version = "=4.5.23", features = ["derive", "env"] }
csv = "=1.3.1"
ctrlc = "=3.4.5"
libc = "=0.2.186"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.134"
thiserror = "=1.0.69"
toml = "=0.8.23"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
